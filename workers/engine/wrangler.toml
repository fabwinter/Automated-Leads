name = "outreach-engine"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

[env.production]
routes = [
  { pattern = "api.example.com/discover", zone_name = "example.com" }
]

[[r2_buckets]]
binding = "R2"
bucket_name = "outreach-engine"
jurisdiction = "eu"

[env.development]
vars = { ENVIRONMENT = "development" }

[env.production]
vars = { ENVIRONMENT = "production" }
